[package]
name = "takto"
version = "0.1.6"
edition = "2021"
description = "A stable and customizable GNOME metronome"
license = "MIT"

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
cpal = "0.15"
dirs = "5.0"
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis"] }
# Blocking HTTP client for the GitHub-releases update check. rustls keeps
# its CA roots inside the binary, so the Flatpak sandbox needs no system
# certificate store.
ureq = "2"

gtk = { package = "gtk4", version = "0.9", features = ["v4_12"], optional = true }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"], optional = true }

[features]
default = []
ui = ["dep:gtk", "dep:adw"]

# Debian package definition, built in CI with `cargo deb --no-build`
# after `cargo build --release --features ui`. `$auto` derives the runtime
# dependencies from the linked shared libraries (GTK 4, libadwaita, ALSA).
[package.metadata.deb]
maintainer = "ez404-36 <210903914+ez404-36@users.noreply.github.com>"
copyright = "2026, ez404-36"
extended-description = """\
Takto keeps timing in the audio callback, not in a GUI timer: beats are \
planned in audio samples over a continuous cpal output stream. It offers \
20–300 BPM with continuous tempo changes and tap tempo, 2/4, 3/4, 4/4 and \
6/8 accent patterns, built-in click presets, WAV import, a native \
libadwaita UI with light and dark theme support, and persistent settings."""
depends = "$auto"
section = "sound"
priority = "optional"
assets = [
    ["target/release/takto", "usr/bin/", "755"],
    ["packaging/io.github.ez404_36.Takto.desktop", "usr/share/applications/", "644"],
    ["assets/brand/icons/takto-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/takto-symbolic.svg", "644"],
    ["assets/brand/icons/takto-64.png", "usr/share/icons/hicolor/64x64/apps/takto.png", "644"],
    ["assets/brand/icons/takto-128.png", "usr/share/icons/hicolor/128x128/apps/takto.png", "644"],
    ["assets/brand/icons/takto-256.png", "usr/share/icons/hicolor/256x256/apps/takto.png", "644"],
]
