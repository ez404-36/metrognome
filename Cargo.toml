[package]
name = "metrognome"
version = "0.1.0"
edition = "2021"
description = "A stable and customizable GNOME metronome"
license = "MIT"

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
cpal = "0.15"
dirs = "5.0"
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

gtk = { package = "gtk4", version = "0.9", features = ["v4_12"], optional = true }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"], optional = true }

[features]
default = []
ui = ["dep:gtk", "dep:adw"]
