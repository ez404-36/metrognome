name: CI

# Fast gate for branches and PRs. The release workflow repeats these checks
# because a tag is the release trigger; this workflow exists so broken
# branches cannot reach that point unnoticed.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap packaging checks: keep the Flatpak manifest, AppStream metadata,
  # desktop entry and vendored cargo sources consistent without building
  # anything (the release workflow does the full Flatpak build).
  packaging-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-yaml \
            appstream \
            desktop-file-utils

      # cargo-sources.json pins the crates.io dependencies for the Flatpak
      # build; it must be regenerated whenever Cargo.lock changes.
      - name: Check vendored cargo sources are up to date
        run: python3 scripts/generate-cargo-sources.py --check

      - name: Validate the Flatpak manifest
        run: python3 -c "import yaml, sys; yaml.safe_load(open('packaging/flatpak/io.github.metrognome.Metrognome.yml')); print('manifest YAML ok')"

      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net packaging/io.github.metrognome.Metrognome.metainfo.xml

      - name: Validate the desktop entry
        run: desktop-file-validate packaging/io.github.metrognome.Metrognome.desktop

  # Full Flatpak build on PRs and master: this exercises the exact manifest
  # the release workflow ships, so manifest breakage cannot first appear at
  # release time. The GNOME runtimes download fresh on every runner (~2 GB);
  # the action caches the build state, so vendored crates and compiled
  # dependencies only rebuild when Cargo.lock changes.
  build-flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # ubuntu-24.04 runner images no longer ship flatpak-builder, and the
      # flatpak-github-actions action (v6) does not install it itself.
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          # The runner user cannot deploy into the system installation
          # (polkit), so pre-install the runtime the manifest needs; the
          # action's --install-deps-from step then finds everything present.
          sudo flatpak install -y --noninteractive flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50
          # The rust-stable extension branches per freedesktop version
          # (GNOME 50 tracks freedesktop 25.08), not per GNOME version.
          # Resolve the branch the SDK actually wants; fall back to 25.08.
          rust_branch="$(flatpak info --show-metadata org.gnome.Sdk//50 \
            | awk '/\[Extension org\.freedesktop\.Sdk\.Extension\.rust-stable\]/{f=1} f && /^version=/{gsub("version=","");print;exit}')"
          if [ -z "$rust_branch" ]; then rust_branch="25.08"; fi
          echo "Installing rust-stable//$rust_branch"
          sudo flatpak install -y --noninteractive flathub \
            "org.freedesktop.Sdk.Extension.rust-stable//$rust_branch"

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.metrognome.Metrognome.yml
          cache-key: flatpak-builder-v1
          # No bundle on CI: the release workflow produces the distributable
          # bundle; here we only prove the manifest builds.
          build-bundle: false
          upload-artifact: 'false'

  check-and-build:
    runs-on: ubuntu-24.04
    # The `ui` feature needs GTK 4.12 / libadwaita 1.5 headers, which first
    # ship in Ubuntu 24.04 (see release.yml).
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libasound2-dev

      - name: Formatting (rustfmt)
        run: cargo fmt --check

      - name: Clippy (ui feature — the shipped configuration)
        run: cargo clippy --all-targets --features ui -- -D warnings

      - name: Test
        run: cargo test

      - name: Build GUI binary
        run: cargo build --features ui
