<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Takto</title>
  <desc id="description">A native GNOME-style metronome built with Rust, GTK 4 and libadwaita.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e24"/>
      <stop offset=".58" stop-color="#22262d"/>
      <stop offset="1" stop-color="#191d25"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset=".55" stop-color="#c061cb"/>
      <stop offset="1" stop-color="#ffb86b"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".045"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="34" fill="url(#surface)"/>
  <rect x="1" y="1" width="1198" height="298" rx="33" fill="none" stroke="#39404a" stroke-width="2"/>
  <circle cx="1062" cy="52" r="150" fill="url(#accent)" opacity=".08"/>
  <circle cx="180" cy="255" r="120" fill="url(#accent)" opacity=".07"/>

  <g transform="translate(82 55)" filter="url(#soft-shadow)">
    <rect width="94" height="150" rx="26" fill="#2e3339"/>
    <rect x="11" y="11" width="72" height="128" rx="19" fill="#25292e"/>
    <path d="M62 32 45 110" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="45" cy="110" r="8" fill="#c061cb"/>
    <rect x="24" y="126" width="46" height="7" rx="3.5" fill="#484e55"/>
    <circle cx="47" cy="35" r="4" fill="#62a0ea"/>
    <circle cx="39" cy="59" r="3.5" fill="#62a0ea" opacity=".68"/>
    <circle cx="34" cy="80" r="3" fill="#62a0ea" opacity=".42"/>
  </g>

  <g fill="#f6f5f4">
    <text x="222" y="130" font-family="Inter, system-ui, sans-serif" font-size="70" font-weight="750" letter-spacing="-2">Takto</text>
    <text x="225" y="176" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="450" fill="#9aa5ac">A stable and customizable GNOME metronome</text>
  </g>

  <g font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="650">
    <g transform="translate(225 211)">
      <rect width="87" height="37" rx="18.5" fill="url(#chip)" stroke="#454b54"/>
      <text x="43.5" y="24" text-anchor="middle" fill="#d7dde1">Rust</text>
    </g>
    <g transform="translate(324 211)">
      <rect width="83" height="37" rx="18.5" fill="url(#chip)" stroke="#454b54"/>
      <text x="41.5" y="24" text-anchor="middle" fill="#d7dde1">GTK 4</text>
    </g>
    <g transform="translate(419 211)">
      <rect width="124" height="37" rx="18.5" fill="url(#chip)" stroke="#454b54"/>
      <text x="62" y="24" text-anchor="middle" fill="#d7dde1">libadwaita</text>
    </g>
    <g transform="translate(555 211)">
      <rect width="85" height="37" rx="18.5" fill="url(#chip)" stroke="#454b54"/>
      <text x="42.5" y="24" text-anchor="middle" fill="#d7dde1">cpal</text>
    </g>
  </g>

  <g transform="translate(837 95)">
    <rect width="272" height="116" rx="26" fill="#2e3339" stroke="#454b54" filter="url(#soft-shadow)"/>
    <circle cx="44" cy="46" r="22" fill="url(#accent)"/>
    <path d="M38 34 L57 46 L38 58 Z" fill="#241f31"/>
    <circle cx="108" cy="46" r="15" fill="#62a0ea"/>
    <circle cx="153" cy="46" r="13" fill="#3a5c85"/>
    <circle cx="192" cy="46" r="10" fill="#2b4665"/>
    <rect x="35" y="83" width="105" height="9" rx="4.5" fill="#484e55"/>
    <rect x="35" y="83" width="64" height="9" rx="4.5" fill="url(#accent)"/>
    <text x="215" y="55" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#f6f5f4" text-anchor="middle">120</text>
    <text x="215" y="76" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="650" fill="#9aa5ac" text-anchor="middle">BPM</text>
  </g>
</svg>
